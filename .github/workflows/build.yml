name: Build and Release BootScribe

on:
  push:
    tags:
      - 'v*' # Se ejecuta automáticamente cada vez que subes una etiqueta que empiece con "v" (ej. v1.6.0)

permissions:
  contents: write # Permiso necesario para que GitHub cree la Release automáticamente

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller

    - name: Build BootScribe (--onedir)
      run: |
        pyinstaller --clean --onedir --noconsole --uac-admin --icon bootscribe.ico --add-data "fonts;fonts" --name BootScribe bootscribe.py

    - name: Package as ZIP with Version Name
      shell: pwsh
      run: |
        $version = "${{ github.ref_name }}"
        Compress-Archive -Path dist/BootScribe/* -DestinationPath "BootScribe-$version-win64.zip"

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        files: BootScribe-${{ github.ref_name }}-win64.zip
        generate_release_notes: true
        prerelease: ${{ startsWith(github.ref_name, 'v0.') }}
